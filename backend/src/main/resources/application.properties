# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=smart-attendance-backend

# Database Configuration (Defaults to in-memory PostgreSQL-compatible mode for instant local testing, override with Supabase)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:smartattendance;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# SQL Seed Data
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Security & JWT Configuration
smartattendance.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
smartattendance.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
smartattendance.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Biometric & Face Verification Configuration
smartattendance.face.match-threshold=${FACE_MATCH_THRESHOLD:0.75}

# CORS Configuration
smartattendance.cors.allowed-origins=${FRONTEND_URL:http://localhost:8081,http://localhost:19006,http://localhost:5173,http://localhost:3000}

# Supabase Admin Integration (Optional backend bridge)
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# File Upload / Camera Payload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
